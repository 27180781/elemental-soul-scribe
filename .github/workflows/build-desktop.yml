name: Build desktop app

# Builds ready-to-run desktop apps for Windows, macOS and Linux on GitHub's
# servers (which have full internet + Node), so no one has to build locally.
#
# It runs automatically on every push to the development branch and publishes
# the installers to a GitHub Release, so you can just download a prebuilt file
# (e.g. the Windows portable .exe) from the Releases page — no Node, no build.
# It also runs on version tags (v*) and can be started manually from the
# Actions tab ("Run workflow").

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - claude/offline-local-system-l24ya3

permissions:
  contents: write

env:
  # No Apple Developer certificate on CI — build unsigned instead of failing.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build desktop app
        run: npm run electron:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    name: Publish release
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Elemental Soul Scribe — אפליקציית שולחן עבודה
          body: |
            אפליקציית שולחן עבודה שרצה **אופליין לגמרי** על המחשב.

            ### הורדה
            - **Windows:** `ElementalSoulScribe-Portable.exe` — רץ ישר בלחיצה כפולה, בלי התקנה
              (או `...Setup.exe` להתקנה רגילה).
            - **macOS:** קובץ `.dmg`
            - **Linux:** קובץ `.AppImage`

            > בהרצה ראשונה ב‑Windows: אם מופיעה אזהרת SmartScreen, לוחצים
            > "מידע נוסף" → "הפעל בכל זאת" (התוכנה אינה חתומה דיגיטלית).
          files: installers/**/*
          fail_on_unmatched_files: false
